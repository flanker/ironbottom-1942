<!doctype html>
<meta charset="utf-8">
<title>铁底湾 1942 · 舰模查看</title>
<script>
  // Close-up model viewer. ?ship=fletcher&a=40&e=12&d=1.3  (azimuth deg, elevation deg, distance × L, lz: look-at point along the hull, -1 stern … 1 bow)
  // Keys: ←/→ orbit, ↑/↓ elevation, +/- distance, [ / ] cycle ships.
  fetch('../index.html').then(r => r.text()).then(html => {
    html = html.replace('<head>', '<head><script>window.__IBS_DEBUG = true; window.__IBS_BASE = "../"<\/script>')
               .replace('</body>', '<script src="viewer.js"><\/script></body>');
    document.open(); document.write(html); document.close();
  });
</script>
